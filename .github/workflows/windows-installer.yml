name: Windows installer

on:
  push:
    branches:
      - main
      - dev
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Windows installer on Linux
    runs-on: ubuntu-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Wine and virtual display
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes wine wine32:i386 xvfb xauth

      - name: Install dependencies
        run: npm ci

      - name: Test update channel selection
        run: npm test

      - name: Prepare Dev version
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        id: dev-version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/prepare-release.mjs dev

      - name: Prepare Stable version
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || startsWith(github.ref, 'refs/tags/v')
        id: stable-version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/prepare-release.mjs stable

      - name: Ensure Stable tag belongs to main
        if: startsWith(github.ref, 'refs/tags/v')
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Set Dev build labels
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        run: |
          echo "BUILD_TIMESTAMP=${{ steps.dev-version.outputs.display_timestamp }}" >> "$GITHUB_ENV"
          echo "UPDATE_CHANNEL=dev" >> "$GITHUB_ENV"

      - name: Set Stable build labels
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "BUILD_TIMESTAMP=${{ steps.stable-version.outputs.display_timestamp }}" >> "$GITHUB_ENV"
          echo "UPDATE_CHANNEL=stable" >> "$GITHUB_ENV"

      - name: Build Windows installer
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x800x24" npm run dist -- --publish never

      - name: Publish Dev prerelease
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.dev-version.outputs.tag }}
          RELEASE_TITLE: MKS Dashboard Dev ${{ steps.dev-version.outputs.display_timestamp }}
        run: |
          gh release create "$RELEASE_TAG" release/*.exe release/*.blockmap release/beta.yml \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TITLE" \
            --prerelease \
            --generate-notes

      - name: Publish Stable release
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.stable-version.outputs.tag }}
          RELEASE_TITLE: MKS Dashboard ${{ steps.stable-version.outputs.display_timestamp }}
        run: |
          gh release create "$RELEASE_TAG" release/*.exe release/*.blockmap release/latest.yml \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TITLE" \
            --latest \
            --generate-notes

      - name: Remove old releases
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev' || startsWith(github.ref, 'refs/tags/v'))
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/cleanup-releases.mjs

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: mks-dashboard-windows-setup-${{ github.run_number }}
          path: release/*.exe
          if-no-files-found: error
          retention-days: 14
