name: Label issues for next release

on:
  push:
    branches:
      - dev

permissions:
  contents: read
  issues: write

jobs:
  label:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Label referenced issues
        uses: actions/github-script@v9
        with:
          script: |
            const { execFileSync } = require("node:child_process");
            const { labelNextRelease } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/label-next-release.mjs`);
            const { before, after } = context.payload;
            if (![before, after].every((sha) => /^[a-f0-9]{40}$/i.test(sha))) {
              throw new Error("De push bevat ongeldige commit-ID's.");
            }
            const base = /^0+$/.test(before) ? "origin/main" : before;
            const messages = execFileSync("git", ["log", "--format=%B", `${base}..${after}`], { encoding: "utf8" });
            await labelNextRelease({ github, ...context.repo, messages });
